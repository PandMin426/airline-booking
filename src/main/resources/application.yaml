spring:
  application:
    name: airline-booking-backend
  datasource:
    url: jdbc:mysql://localhost:3307/airline_booking
    username: root
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
    web:
      pageable:
        one-indexed-parameters: true
  kafka:
    bootstrap-servers: localhost:9094

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: airline-booking-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  mail:
    host: smtp.gmail.com
    port: 587
    username: nguyenhuunhatminh426@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


# VNPAY CONFIGURATION
vnpay:
  # Mã website của bạn trên hệ thống VNPay (Terminal ID)
  tmnCode: D9XR1AMD

  # Chuỗi bí mật để ký bảo mật (Tuyệt đối không để lộ ra ngoài Frontend)
  hashSecret: ${VNPAY_HASH_SECRET}

  # Đường dẫn API của VNPay để mình bắn request sang
  payUrl: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

  # Đường link VNPay sẽ "đá" khách hàng về lại web của bạn sau khi quét mã QR xong
  # (Bạn sửa lại cổng 8080 nếu web của bạn chạy cổng khác nhé)
  returnUrl: http://localhost:8080/payments/vnpay-return

# Cấu hình các nghiệp vụ Booking
booking:
  # Thời gian giữ ghế, thanh toán
  hold-minutes: 15